apis:
- name: Global Database API (v2)
  description: >-
    Token-authenticated REST API over the company-intelligence core: company search and lookup (overview,
    autocomplete, enrichment by website / LinkedIn / email), company details, financials (by id or ticker),
    ownership and group structure, digital insights, employees and contact enrichment, prospecting with
    nomenclature-driven filters, the KYB registry API (search, lite/full details, officers, shareholders,
    group structures, financials), credit reports, Verification-of-Payee bank verification, company logos,
    usage metrics, and the Watch Companies API with signed webhooks. Documented as a Slate HTML reference;
    no OpenAPI is published for this surface.
  humanURL: https://api.globaldatabase.com/docs/v2/
