    registration_endpoint: https://mcp.globaldatabase.com/register
    dynamic_client_registration: true
    pkce: S256
    grant_types: [authorization_code, refresh_token]
    token_endpoint_auth_methods: [client_secret_post, client_secret_basic]
    scopes_supported: []
    scopes_note: 'The server publishes no scopes; the README warns Copilot Studio users to leave Scope empty because a non-empty scope fails the token request.'
