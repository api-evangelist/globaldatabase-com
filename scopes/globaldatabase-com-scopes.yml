summary: >-
  The provider runs an OAuth 2.1 authorization server for its MCP endpoint but publishes NO
  scopes: the RFC 9728 protected-resource document declares `scopes_supported: []` and the
  RFC 8414 document omits `scopes_supported` entirely. The README states it plainly ("the
  server publishes no scopes, and a non-empty one fails the token request"). Authorization is
  therefore all-or-nothing at the account level; entitlements (e.g. the AI-query entitlement
  that returns 403 on POST /v2/ai/query) are enforced per account/module server-side, not via
  OAuth scope. The consent page ("You see exactly what the assistant can read, and you can
  revoke it later" — landing page) is coarse-grained. The REST API uses a static token with no
  scope concept; per-module permissions surface only through GET /v2/metrics
  (permission / module / app blocks in the LimitError body).
