summary: >-
  Three real documents are served, all on the MCP host mcp.globaldatabase.com: RFC 8414
  authorization-server metadata, RFC 9728 protected-resource metadata (at both the bare path and
  the /mcp resource-suffixed path the 401 challenge's resource_metadata names), and an
  openid-configuration that is a byte-identical copy of the RFC 8414 document (no jwks_uri,
  userinfo_endpoint or id_token signing algs, so it is not an OIDC discovery document in
  substance). That earns the WellKnown pointer. No security.txt is served anywhere (so NO
  SecurityTxt pointer), no api-catalog, ai-plugin.json, apis.json, ucp/acp/aauth, and no A2A
  agent card on any host. platform.globaldatabase.com is a single-page app that answers 200
  text/html (2,845 bytes) for every path; those rows are recorded as SPA shells, not documents.
  api.globaldatabase.com answers 503 for every path outside /docs/v2/ and /robots.txt.
