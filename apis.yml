- name: Global Database MCP Server
  description: >-
    Hosted remote Model Context Protocol server (streamable HTTP) exposing 23 read-only tools over company
    profiles, financials, ownership, digital insights, people search and contact enrichment, prospecting
    and KYB registry lookups, plus gdb:// reference resources and five prompts. OAuth 2.1 with PKCE and
    dynamic client registration; RFC 8414 / RFC 9728 metadata on the host. Listed in the Official MCP
    Registry (com.globaldatabase/mcp), Smithery and Glama; distribution metadata and three Agent Skills
    at github.com/global-database/mcp-server. The host also serves a FastAPI-generated OpenAPI describing
    its browser playground and OAuth pages (captured under openapi/).
  humanURL: https://mcp.globaldatabase.com/
  baseURL: https://mcp.globaldatabase.com/mcp
