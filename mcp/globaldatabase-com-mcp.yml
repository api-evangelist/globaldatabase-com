    protected_resource: well-known/globaldatabase-com-mcp-oauth-protected-resource.json
    login_ux: 'Browser login page on first connect where the user pastes a Global Database API key; the key is held in the access-token claims server-side and never passed as a tool argument (README). The docs v2 page describes the same flow as "authenticate with your GlobalDatabase API key".'
